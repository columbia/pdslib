name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests with experimental features
      run: cargo test --features experimental --verbose
    - name: Run integration tests
      run: |
        cargo test --package pdslib --features experimental --test ppa_demo -- --nocapture
        cargo test --package pdslib --features experimental --test simple_events_demo -- --nocapture
    - name: Run clippy
      run: cargo clippy --tests -- -D warnings

  python:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        cd bindings/python
        python -m venv .venv
        source .venv/bin/activate
        pip install -e ".[dev]"
    - name: Build and test
      run: |
        cd bindings/python
        source .venv/bin/activate
        pip install maturin
        maturin develop
        pytest tests/
