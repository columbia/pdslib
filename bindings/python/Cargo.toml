[package]
name = "pdslib-python"
version = "0.3.0"
edition = "2024"

[lib]
name = "pdslib_python"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
pdslib = { path = "../..", features = ["experimental"] }
pyo3 = { version = "0.27", features = ["extension-module", "anyhow"] }

[features]
default = []
experimental = ["pdslib/experimental"]